<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Magic Bridge — 투자 교육 플랫폼</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"/>
<link rel="stylesheet" href="src/tokens.css"/>
<style id="runtime-styles"></style>
<template id="__bundler_thumbnail" data-bg-color="#0A1936">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="tg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#E8C37A"/>
        <stop offset="1" stop-color="#B8893A"/>
      </linearGradient>
    </defs>
    <path d="M100 540 Q 600 220 1100 540" stroke="url(#tg)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M100 540 H 1100" stroke="url(#tg)" stroke-width="2" stroke-linecap="round"/>
    <path d="M260 540 V 240 M940 540 V 240" stroke="url(#tg)" stroke-width="1.5" opacity="0.6"/>
    <path d="M260 280 H 940" stroke="url(#tg)" stroke-width="1" opacity="0.4"/>
    <text x="600" y="680" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="36" letter-spacing="6" fill="#F5F2E8">MAGIC</text>
    <text x="600" y="730" text-anchor="middle" font-family="Inter, sans-serif" font-weight="300" font-size="28" letter-spacing="8" fill="url(#tg)">BRIDGE</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/hero-visuals.jsx"></script>
<script type="text/babel" src="src/landing.css.jsx"></script>
<script type="text/babel" src="src/app.css.jsx"></script>
<script type="text/babel" src="src/landing.jsx"></script>
<script type="text/babel" src="src/login.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>
<script type="text/babel" src="src/tweaks.jsx"></script>

<script type="text/babel">
  const { useState, useEffect } = React;

  // inject collected styles
  document.getElementById('runtime-styles').textContent =
    (window.landingStyles || '') + '\n' + (window.appStyles || '') + '\n' + (window.tweaksStyles || '');

  function Root() {
    const [route, setRoute] = useState(() => localStorage.getItem('ab_top_route') || 'landing');
    const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
    useEffect(() => { applyTweaks(tweaks); }, []);
    useEffect(() => { localStorage.setItem('ab_top_route', route); }, [route]);

    return (
      <>
        {route === 'landing' && <Landing heroStyle={tweaks.heroStyle} onLogin={()=>setRoute('login')} data-screen-label="Landing"/>}
        {route === 'login' && <Login onSignIn={()=>setRoute('app')} onBack={()=>setRoute('landing')} data-screen-label="Login"/>}
        {route === 'app' && <App onLogout={()=>setRoute('landing')} data-screen-label="App"/>}
        <Tweaks tweaks={tweaks} setTweaks={setTweaks}/>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>

</body>
</html>
